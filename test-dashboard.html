<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Test - Widget Context</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 900px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .card-title {
      color: #666;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .card-value {
      font-size: 32px;
      font-weight: 600;
      color: #111;
    }
    .card-change {
      font-size: 14px;
      color: #22c55e;
      margin-top: 4px;
    }
    .card-change.negative {
      color: #ef4444;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 16px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background: #f9f9f9;
      font-weight: 500;
      color: #666;
    }
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-danger {
      background: #ef4444;
    }
    .form-section {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
      max-width: 400px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      color: #444;
    }
    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <h1>Analytics Dashboard</h1>

  <!-- Dashboard Cards - Tests number context -->
  <div class="dashboard">
    <div class="card">
      <div class="card-title">Total Revenue</div>
      <div class="card-value">$45,231</div>
      <div class="card-change">↑ 12.5%</div>
    </div>
    <div class="card">
      <div class="card-title">Active Users</div>
      <div class="card-value">2,847</div>
      <div class="card-change negative">↓ 3.2%</div>
    </div>
    <div class="card">
      <div class="card-title">Conversion Rate</div>
      <div class="card-value">4.6%</div>
      <div class="card-change">↑ 0.8%</div>
    </div>
  </div>

  <!-- Table - Tests row context -->
  <table>
    <thead>
      <tr>
        <th>User</th>
        <th>Email</th>
        <th>Plan</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>John Doe</td>
        <td>john@example.com</td>
        <td>Pro</td>
        <td>
          <button class="btn">Edit</button>
          <button class="btn btn-danger">Delete</button>
        </td>
      </tr>
      <tr>
        <td>Jane Smith</td>
        <td>jane@example.com</td>
        <td>Basic</td>
        <td>
          <button class="btn">Edit</button>
          <button class="btn btn-danger">Delete</button>
        </td>
      </tr>
      <tr>
        <td>Bob Wilson</td>
        <td>bob@example.com</td>
        <td>Enterprise</td>
        <td>
          <button class="btn">Edit</button>
          <button class="btn btn-danger">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Form - Tests label association -->
  <div class="form-section">
    <h2>Add New User</h2>
    <form id="user-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter name">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter email">
      </div>
      <div class="form-group">
        <label for="plan">Subscription Plan</label>
        <select id="plan" name="plan">
          <option value="">Select plan</option>
          <option value="basic">Basic - $9/mo</option>
          <option value="pro">Pro - $29/mo</option>
          <option value="enterprise">Enterprise - $99/mo</option>
        </select>
      </div>
      <button type="submit" class="btn">Create User</button>
    </form>
  </div>

  <!-- Widget script -->
  <script src="http://localhost:3001/embed/ivre94fxtd.js" async></script>
</body>
</html>
